name: keep-alive

# Pings the backend so Render's free tier doesn't spin the service down (which
# otherwise causes a 30-60s cold start on the next request). Best-effort: GitHub's
# scheduler can run late under load, so for guaranteed uptime use a dedicated monitor
# (e.g. a free UptimeRobot HTTP monitor on the same /api/health URL, 5-min interval).
on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 https://omega-kitchen-api.onrender.com/api/health || true
