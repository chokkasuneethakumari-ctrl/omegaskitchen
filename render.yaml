# Render blueprint for the Omega's Kitchen backend.
# Uses Docker (python:3.12-slim) instead of Render's native Python runtime, because
# the native runtime's OpenSSL fails the TLS handshake with MongoDB Atlas
# (TLSV1_ALERT_INTERNAL_ERROR). The slim image's standard OpenSSL connects cleanly.
services:
  - type: web
    name: omega-kitchen-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGO_URL          # your MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        value: omega_kitchen
      - key: JWT_SECRET         # Render generates a strong random value
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # GMAIL_USER / GMAIL_APP_PASSWORD (or RESEND_API_KEY): add later in the dashboard.
